services:
  backend:
    build:
      context: ./Backend
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in your environment or .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment or .env}
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
