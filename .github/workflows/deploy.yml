name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Frontend/package-lock.json
            Backend/package-lock.json
      - name: Install and build frontend
        working-directory: Frontend
        run: npm ci && npm run lint && npm run build
      - name: Check backend syntax
        working-directory: Backend
        run: npm ci && npm run check

  deploy-frontend:
    name: Deploy frontend to Vercel
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Link Vercel project
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: mkdir -p .vercel && printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - run: npm install --global vercel
      - name: Deploy frontend to Vercel
        run: vercel deploy --prod --token="${{ secrets.VERCEL_TOKEN }}" --build-env "VITE_API_URL=$VITE_API_URL"
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  deploy-backend:
    name: Deploy backend to Render
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
